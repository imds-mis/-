services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: imds_documents
      POSTGRES_USER: imds
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-imds-local-change-me}
    volumes:
      - imds-documents-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U imds -d imds_documents"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://imds:${POSTGRES_PASSWORD:-imds-local-change-me}@postgres:5432/imds_documents
      STORAGE_ROOT: /var/lib/imds-documents
      QR_SIGNING_SECRET: ${QR_SIGNING_SECRET}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:8080}
      MIS_UPSTREAM_URL: ${MIS_UPSTREAM_URL}
      MIS_AUTH_TOKEN: ${MIS_AUTH_TOKEN}
      SPEECH_PIPELINE_URL: ${SPEECH_PIPELINE_URL}
      LLM_BASE_URL: ${LLM_BASE_URL}
      LLM_API_KEY: ${LLM_API_KEY}
      LLM_MODEL: ${LLM_MODEL}
      STT_URL: ${STT_URL:-}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}
      PORT: "8080"
    volumes:
      - imds-documents-storage:/var/lib/imds-documents
    ports:
      - "8080:8080"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 20

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8080}
    ports:
      - "5173:80"
    depends_on:
      api:
        condition: service_healthy

volumes:
  imds-documents-postgres:
  imds-documents-storage:
